# =============================================================================
# kind 클러스터 설정 (Mac 로컬 환경)
# Ingress-NGINX 컨트롤러 사용을 위한 포트 매핑 포함
#
# 사용법: kind create cluster --config kind-config.yaml --name ai-platform
# =============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP: 호스트 80 → 컨테이너 80 (Ingress)
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS: 호스트 443 → 컨테이너 443 (Ingress)
      - containerPort: 443
        hostPort: 443
        protocol: TCP
